[package]
name = "thumbpad"
version = "0.1.0"
edition = "2021"
[build-dependencies]
tauri-build = { version = "2", features = [] }
[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-autostart = "2"
thumbpad-core = { path = "../core" }
serde = { version = "1", features = ["derive"] }
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
open = "5"
