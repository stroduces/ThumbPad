name: Build, test and package ThumbPad
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
      - name: SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Build and verify
        run: |
          chmod +x android/gradlew
          android/gradlew -p android testDebugUnitTest lintDebug assembleDebug assembleRelease
          mkdir -p dist
          cp android/app/build/outputs/apk/debug/app-debug.apk dist/ThumbPad-Android-debug.apk
          cp android/app/build/outputs/apk/release/app-release-unsigned.apk dist/ThumbPad-Android-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/ThumbPad-Android-debug.apk
          python scripts/inspect-artifacts.py dist
      - name: Sign release when secrets are available
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            printf '%s' "$KEYSTORE" | base64 --decode > "$RUNNER_TEMP/release.jks"
            "$ANDROID_HOME/build-tools/36.0.0/zipalign" -p -f 4 dist/ThumbPad-Android-release-unsigned.apk "$RUNNER_TEMP/aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" sign --ks "$RUNNER_TEMP/release.jks" --ks-key-alias "$KEY_ALIAS" --ks-pass env:STORE_PASSWORD --key-pass env:KEY_PASSWORD --out dist/ThumbPad-Android-release.apk "$RUNNER_TEMP/aligned.apk"
            "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose dist/ThumbPad-Android-release.apk
          fi
      - uses: actions/upload-artifact@v4
        with: {name: ThumbPad-Android, path: 'dist/*.apk', if-no-files-found: error}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: Android-test-reports, path: 'android/app/build/reports/'}
  android-emulator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}
      - uses: android-actions/setup-android@v3
        with: {packages: platform-tools}
      - uses: gradle/actions/setup-gradle@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: dtolnay/rust-toolchain@stable
      - name: Build isolated TLS test receiver
        run: |
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
          cargo build --locked --manifest-path desktop/core/Cargo.toml --example smoke_receiver
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: chmod +x android/gradlew
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          script: |
            android/gradlew -p android assembleDebug assembleDebugAndroidTest
            node scripts/android-network-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-device-reports
          path: |
            dist/reports/android-instrumentation.txt
            docs/screenshots/*.png
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundle: nsis
            artifact: ThumbPad-Windows
          - os: macos-latest
            target: aarch64-apple-darwin
            bundle: dmg
            artifact: ThumbPad-macOS-AppleSilicon
          - os: macos-latest
            target: x86_64-apple-darwin
            bundle: dmg
            artifact: ThumbPad-macOS-Intel
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: desktop/package-lock.json}
      - uses: dtolnay/rust-toolchain@stable
        with: {targets: '${{ matrix.target }}', components: rustfmt, clippy}
      - name: Core tests and loopback integration
        shell: bash
        run: |
          cargo fmt --manifest-path desktop/core/Cargo.toml -- --check
          cargo test --locked --manifest-path desktop/core/Cargo.toml
          cargo clippy --locked --manifest-path desktop/core/Cargo.toml --all-targets -- -D warnings
          cargo build --locked --manifest-path desktop/core/Cargo.toml --example smoke_receiver
          node scripts/network-smoke.mjs
      - name: Desktop package
        shell: bash
        run: |
          npm ci --prefix desktop
          npm --prefix desktop run build -- --target ${{ matrix.target }} --bundles ${{ matrix.bundle }}
          python scripts/collect-artifacts.py ${{ matrix.target }}
          python scripts/inspect-artifacts.py dist
      - name: Windows install and uninstall smoke
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows-install-smoke.ps1
      - name: macOS disk image inspection
        if: runner.os == 'macOS'
        shell: bash
        run: bash scripts/macos-install-smoke.sh
      - uses: actions/upload-artifact@v4
        with: {name: '${{ matrix.artifact }}', path: 'dist/', if-no-files-found: error}
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [android, android-emulator, desktop]
    runs-on: ubuntu-latest
    permissions: {contents: write}
    steps:
      - uses: actions/download-artifact@v4
        with: {pattern: 'ThumbPad-*', path: assets, merge-multiple: true}
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            assets/*.apk
            assets/*.exe
            assets/*.dmg
